// STD_ChaineVersDate
// ------------------------------------------------------------------------------------------------
// Parametres :
//	d : chaine contenant la date
//	f : format de la chaine
function _CVD(d,f)
{
	// Normalise le masque
	f = f.replace(/D/g, "J").replace(/Y/g, "A");
	// Gere les format pour lesquel il manque une composante
	var j = (-1 != f.indexOf("J")) ? "" : "01";
	var m = (-1 != f.indexOf("M")) ? "" : "01";
	var a = (-1 != f.indexOf("A")) ? "" : "" + (new Date()).getUTCFullYear();

	// Traite caractere par caractere le masque
	var nF = 0;
	var nD = 0;
	var fParseJM = function(c)
	{
		var s;
		// Compte le nombre de caracteres
		if (f.charAt(nF + 1) == c)
		{
			s = d.substr(nD, 2);
			nF++;
			nD++;
		}
		else if (isNaN(parseInt(d.charAt(nD + 1), 10)))
		{
			s = "0" + d.charAt(nD);
		}
		else
		{
			s = d.substr(nD, 2);
			nD++;
		}
		return s;
	};
	for(;nF<f.length;nF++,nD++)
	{
		switch(f.charAt(nF))
		{
		case "J":
			j = fParseJM("J");
			break;

		case "M":
			m = fParseJM("M");
			break;

		case "A":
		case "Y":
			// Sur 2 ou sur 4 ?
			if (f.indexOf("AAAA")==nF)
			{
				a = d.substr(nD, 4);
				nF+=3;
				nD+=3;
			}
			else
			{
				a = d.substr(nD, 2);
				a= (parseInt(a)>50?"19":"20")+a;
				nF++;
				nD++;
			}
			break;
		}
	}

	var sRes=a+m+j;
	return (sRes.length==8)?sRes:"";
}
// MakeDateFromWD
// ------------------------------------------------------------------------------------------------
// Cette fonction prend une date au format AAAAMMJJHHMMSS avec MM dans 1..12 et retourne un objet date
// La chaine peut etre tronquee a la date auquel cas l'heure sera nulle
// Parametres :
//	c : chaine contenant la date 
// Variables locales :
//	a : annee
//	d : date resultat
function _WMD(c)
{
	// on recupere l'annee
	var a=c.substring(0,4);
	// on construit la date
	var d=new Date(a,parseInt(c.substring(4,6), 10) - 1,c.substring(6,8),c.substring(8,10),c.substring(10,12),c.substring(12,14),c.substring(14,16)+"0");
	// si l'annee est inferieure a 100, on construit l'annee complete
	if (parseInt(a, 10) < 100)
	{
		d.setFullYear(a);
	}
	// on renvoie la date resultat
	return d;
}
// JS_DateToWD
// ------------------------------------------------------------------------------------------------
// Cette fonction prend un objet Date et retourne une date au format WL AAAAMMJJ (avec MM dans 1..12)
// Parametres :
//	d : objet Date 
// Variables locales :
//	s : date en chaine au format WL
//	m : mois en entier entre 1 et 12
//	j : j en entier
function _JDTW(d)
{
	// Calcule l'annee
	var s = d.getFullYear();
	// Calcule le mois en chaine
	var m = d.getMonth() + 1;
	s += ((m < 10) ? "0" : "") + m;
	// Calcule le jour en chaine
	var j = d.getDate();
	s += ((j < 10) ? "0" : "") + j;
	// Renvoie la date resultat
	return s;
}
// STD_DateVersChaineInterne
// ------------------------------------------------------------------------------------------------
// Variables locales :
//	v : chaine contenant une partie de la valeur
//	r : format courant de la chaine
//	tf : Tableau des formats : tableau de couples format, longueur de chaine courte
function _DVCI(v,r,tf)
{
	for (var i = 0; i < tf.length; i++)
	{
		// Recherche la position du jour dans le format
		var j = r.indexOf(tf[i][0]);
		if(j > -1)
		{
			// Supprime les 0 non significatifs
			while ((v.charAt(0) == "0") && (tf[i][1] > 0))
			{
				v = v.substring(1);
				tf[i][1]--;
			}
			// Retourne la chaine
			return r.substring(0,j) + v + r.substring(j + tf[i][0].length, r.length);
		}
	}
	return r;
}
// STD_DateVersChaine
// ------------------------------------------------------------------------------------------------
// Variables locales :
//	d : chaine contenant la date au format AAAAMMJJ
//	f : format de la chaine
// Variables locales :
//	r : resultat
// 	a : position des annees
//	m : position des mois
//	j : position des jours
function _DVC(d,f)
{
	if(d=="")return"";
	var r=f;

	r = _DVCI(d.substring(6,8),r,[["JJ", 0], ["DD", 0], ["J", 1], ["D", 1]]);
	r = _DVCI(d.substring(4,6),r,[["MM", 0], ["M", 1]]);

	var a=r.indexOf("AAAA");
	if(a==-1)a=r.indexOf("YYYY");
	if(a>-1)return r.substring(0,a)+d.substring(0,4)+r.substring(a+4,r.length);
	a=r.indexOf("AA");
	if(a==-1)a=r.indexOf("YY");
	return r.substring(0,a)+d.substring(2,4)+r.substring(a+2,r.length);
}
// v : Date au format du champ
// f : format de la date du champ
// d : Nombre de jour du déclage
function _JDJ(v,f,d)
{
	v=_CVD(v,f);
	v=_WMD(v);
	v.setTime(v.getTime()+d*86400000);
	v=_JDTW(v);
	return _DVC(v,f);
}
